<form class="formreg" id="SignupForm">

<div class="register" id="FormRegister">
  <div class="container">
  <div class="logoreg">
     <img class="logo" src="./images/photo_6044146341832758806_y.jpg" alt="Beauty clinic logo">
  </div>
  <h1 class="title1">Welcome to Beauty clinic</h1>

   <div class="fullname">
    <label for="FullName" class="form-label">Full Name</label>
    <input placeholder="Full Name..." type="text" class="form-control" id="FullName">
   </div>

    <div class="Age">
    <label for="Age" class="form-label">Age</label>
    <input placeholder="Age..." type="number" class="form-control" id="Age">
    </div>

     <div class="Gender">
    <label for="Gender" class="form-label">Male</label>
    <input type="radio" name="Gender" id="Gender"  value="Male">

    <label for="Gender2" class="form-label">Female</label>
    <input type="radio" name="Gender" id="Gender2" value="Female">
     </div>
  
  <div class="emailregister">
    <label for="Emailregister" class="form-label">Email address</label>
    <input placeholder="Email..." type="email" class="form-control" id="Emailregister" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text text-danger">We'll never share your email with anyone else!</div>
  </div>
  <div class="passwordregister">
    <label for="Passwordregister" class="form-label">Password</label>
    <input placeholder="Password..." type="password" class="form-control" id="Passwordregister">
  </div>
   <div class="ConfirmPasswordregister">
    <label for="ConfirmPasswordregister" class="form-label">Confirm Password</label>
    <input placeholder="Confirm Password..." type="password" class="form-control" id="ConfirmPasswordregister">
   </div>
 <p id="Message"></p>
  <button type="submit" class="btn1">Create My Account</button>

  </div>
</div>
